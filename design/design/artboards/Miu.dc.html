<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>

<radialGradient id="miuBtn" cx="40%" cy="35%" r="70%">

<stop offset="1" stop-color="#2F6BFF"></stop>

<ellipse cx="200" cy="420" rx="124" ry="14" fill="#0B1220" opacity="0.12"></ellipse>

<circle cx="200" cy="354" r="19" fill="url(#miuBtn)"></circle>

<ellipse cx="240" cy="404" rx="36" ry="19" fill="url(#miuFur)"></ellipse>

</g>

<path d="M294 124 C 300 94 298 68 290 52 C 272 64 258 78 250 96 Z" fill="#F8E1DE"></path>
</g>

<path d="M200 78 C 285 78 335 125 335 180 C 335 205 325 222 312 232 L 322 244 L 300 242 C 275 258 240 266 200 266 C 160 266 125 258 100 242 L 78 244 L 88 232 C 75 222 65 205 65 180 C 65 125 115 78 200 78 Z" fill="url(#miuFur)"></path>
<path d="M192 80 C 193 94 196 100 200 104 C 204 100 207 94 208 80 Z" fill="#5B8CFF" opacity="0.75"></path>
<path d="M168 84 C 170 96 174 101 180 103 C 180 94 178 88 176 83 Z" fill="#5B8CFF" opacity="0.75"></path>
<path d="M232 84 C 230 96 226 101 220 103 C 220 94 222 88 224 83 Z" fill="#5B8CFF" opacity="0.75"></path>

<path d="M200 205 C 225 196 256 205 258 228 C 260 248 236 258 200 252 C 164 258 140 248 142 228 C 144 205 175 196 200 205 Z" fill="url(#miuCream)"></path>
<ellipse cx="112" cy="214" rx="18" ry="10" fill="#F7A8B4" opacity="{{blush}}"></ellipse>
<ellipse cx="288" cy="214" rx="18" ry="10" fill="#F7A8B4" opacity="{{blush}}"></ellipse>

<g opacity="{{openL}}">
<ellipse cx="152" cy="168" rx="{{rx}}" ry="{{ry}}" fill="#FFFFFF"></ellipse>
<circle cx="{{irisLx}}" cy="{{irisY}}" r="24" fill="url(#miuIris)"></circle>
<circle cx="{{irisLx}}" cy="{{irisY}}" r="{{pupil}}" fill="#0B1220"></circle>
<circle cx="{{hiLx}}" cy="{{hiY}}" r="7" fill="#FFFFFF"></circle>

</g>
<g opacity="{{openR}}">
<ellipse cx="248" cy="168" rx="{{rx}}" ry="{{ry}}" fill="#FFFFFF"></ellipse>
<circle cx="{{irisRx}}" cy="{{irisY}}" r="24" fill="url(#miuIris)"></circle>
<circle cx="{{irisRx}}" cy="{{irisY}}" r="{{pupil}}" fill="#0B1220"></circle>
<circle cx="{{hiRx}}" cy="{{hiY}}" r="7" fill="#FFFFFF"></circle>
<circle cx="{{hi2Rx}}" cy="{{hi2Y}}" r="3.5" fill="#FFFFFF"></circle>
</g>
<path d="M124 176 Q 152 140 180 176" fill="none" stroke="#0B1220" stroke-width="8" stroke-linecap="round" opacity="{{happyL}}"></path>
<path d="M220 176 Q 248 140 276 176" fill="none" stroke="#0B1220" stroke-width="8" stroke-linecap="round" opacity="{{happyR}}"></path>
<path d="M124 166 Q 152 190 180 166" fill="none" stroke="#0B1220" stroke-width="8" stroke-linecap="round" opacity="{{closed}}"></path>
<path d="M220 166 Q 248 190 276 166" fill="none" stroke="#0B1220" stroke-width="8" stroke-linecap="round" opacity="{{closed}}"></path>
<path d="M152 196 C 112 170 118 136 139 138 C 146 139 150 144 152 150 C 154 144 158 139 165 138 C 186 136 192 170 152 196 Z" fill="#EF5B6E" opacity="{{heart}}"></path>
<path d="M248 196 C 208 170 214 136 235 138 C 242 139 246 144 248 150 C 250 144 254 139 261 138 C 282 136 288 170 248 196 Z" fill="#EF5B6E" opacity="{{heart}}"></path>
<path d="M126 206 C 118 220 120 230 127 230 C 134 230 136 220 126 206 Z" fill="#E3ECFF" stroke="#2F6BFF" stroke-width="2" opacity="{{tear}}"></path>

<path d="{{browL}}" fill="none" stroke="#1A56C4" stroke-width="7" stroke-linecap="round" opacity="0.85"></path>
<path d="{{browR}}" fill="none" stroke="#1A56C4" stroke-width="7" stroke-linecap="round" opacity="0.85"></path>

<path d="M146 226 L 104 220 M146 236 L 102 241 M254 226 L 296 220 M254 236 L 298 241" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9"></path>
<path d="M200 219 L 200 226" fill="none" stroke="#0B1220" stroke-width="4.5" stroke-linecap="round"></path>
<path d="{{mouthLine}}" fill="none" stroke="#0B1220" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="{{lineOp}}"></path>
<path d="{{mouthFill}}" fill="#0B1220" opacity="{{fillOp}}"></path>
<ellipse cx="200" cy="{{tongueY}}" rx="12" ry="6" fill="#F7A8B4" opacity="{{tongue}}"></ellipse>
<path d="M188 207 C 188 201 212 201 212 207 C 212 213 205 219 200 219 C 195 219 188 213 188 207 Z" fill="#0B1220"></path>
<ellipse cx="195" cy="206" rx="4" ry="2" fill="#FFFFFF" opacity="0.7"></ellipse>

<path d="M140 266 Q 200 290 260 266 L 258 279 Q 200 303 142 279 Z" fill="#2F6BFF"></path>
<circle cx="200" cy="296" r="11" fill="#E3A548" stroke="#8F5A0F" stroke-width="2"></circle>

<g transform="{{armL}}">
<ellipse cx="132" cy="318" rx="21" ry="34" fill="url(#miuFur)" stroke="#6A90EE" stroke-width="2"></ellipse>
<circle cx="132" cy="347" r="15" fill="url(#miuCream)"></circle>
</g>
<g transform="{{armR}}">
<ellipse cx="268" cy="318" rx="21" ry="34" fill="url(#miuFur)" stroke="#6A90EE" stroke-width="2"></ellipse>
<circle cx="268" cy="347" r="15" fill="url(#miuCream)"></circle>
</g>
</g>

<g fill="#E3A548" opacity="{{sparkle}}">
<path d="M58 70 Q 58 88 76 88 Q 58 88 58 106 Q 58 88 40 88 Q 58 88 58 70 Z"></path>
<path d="M346 48 Q 346 62 360 62 Q 346 62 346 76 Q 346 62 332 62 Q 346 62 346 48 Z"></path>
<path d="M362 170 Q 362 180 372 180 Q 362 180 362 190 Q 362 180 352 180 Q 362 180 362 170 Z"></path>
</g>
<path d="M336 96 C 316 82 318 64 330 65 C 334 65 336 68 336 71 C 337 68 339 65 343 65 C 355 64 357 82 336 96 Z" fill="#EF5B6E" opacity="{{love}}"></path>
<text x="316" y="100" font-size="58" font-weight="800" fill="#2F6BFF" opacity="{{question}}">?</text>
<g fill="#1A56C4" font-weight="800" opacity="{{zzz}}">
<text x="300" y="98" font-size="30">z</text>
<text x="322" y="72" font-size="40">z</text>
<text x="348" y="40" font-size="50">Z</text>
</g>
<g fill="#FFFFFF" stroke="#C9D6EA" stroke-width="3" opacity="{{dots}}">
<circle cx="304" cy="96" r="7"></circle>
<circle cx="324" cy="76" r="10"></circle>
<circle cx="350" cy="52" r="14"></circle>
</g>
<path d="M54 104 Q 40 124 54 144 M36 94 Q 16 124 36 154" fill="none" stroke="#2F6BFF" stroke-width="6" stroke-linecap="round" opacity="{{waves}}"></path>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"emotion":{"editor":"enum","options":["neutral","listening","thinking","happy","excited","laughing","love","curious","surprised","wink","shy","confused","sad","sleepy"],"default":"happy"},"size":{"editor":"int","default":400,"min":60,"max":900,"unit":"px"},"motion":{"editor":"boolean","default":true},"$preview":{"width":400,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const emotion = this.props.emotion ?? 'happy';
    const size = Number(this.props.size ?? 400) || 400;
    const motion = this.props.motion !== false && this.props.motion !== 'false';

    const brows = {
      calm: ['M128 122 Q 150 114 172 120', 'M228 120 Q 250 114 272 122'],
      up: ['M128 108 Q 150 98 172 106', 'M228 106 Q 250 98 272 108'],
      sad: ['M128 120 Q 152 116 172 106', 'M228 106 Q 248 116 272 120'],
      focus: ['M128 118 Q 150 114 172 120', 'M228 110 Q 250 100 272 108'],
      tilt: ['M128 112 Q 150 104 172 112', 'M228 122 Q 250 120 272 126'],
    };
    const lines = {
      w: 'M184 224 Q 192 236 200 226 Q 208 236 216 224',
      small: 'M190 230 Q 200 237 210 230',
      flat: 'M192 236 Q 204 233 216 236',
      frown: 'M184 242 Q 200 228 216 242',
      wavy: 'M182 238 Q 191 231 200 238 Q 209 245 218 238',
      smirk: 'M184 230 Q 204 246 222 228',
    };
    const fills = {
      smile: ['M176 226 Q 200 266 224 226 Q 200 234 176 226 Z', 240],
      laugh: ['M166 224 Q 200 286 234 224 Q 200 234 166 224 Z', 246],
      o: ['M188 229 a 12 15 0 1 0 24 0 a 12 15 0 1 0 -24 0 Z', 0],
      tiny: ['M194 233 a 6 7 0 1 0 12 0 a 6 7 0 1 0 -12 0 Z', 0],
    };

    // Every feeling is a handful of knobs, so the 14 faces stay one drawing.
    const base = { eyes: 'open', lx: 0, ly: 0, pupil: 14, wide: false, brow: 'calm', line: 'w', fill: null,
      ear: [0, 0], arm: [15, -15], blush: 0, extra: null };
    const looks = {
      neutral: {},
      listening: { brow: 'up', line: 'small', ear: [-8, 8], arm: [15, -150], extra: 'waves' },
      thinking: { lx: 8, ly: -10, brow: 'focus', line: 'flat', arm: [-35, -15], extra: 'dots' },
      happy: { eyes: 'happy', line: null, fill: 'smile', blush: 0.7, arm: [25, -25] },
      excited: { pupil: 12, brow: 'up', line: null, fill: 'laugh', arm: [150, -150], extra: 'sparkle', blush: 0.5 },
      laughing: { eyes: 'happy', line: null, fill: 'laugh', blush: 0.8, arm: [30, -30], ear: [6, -6] },
      love: { eyes: 'heart', line: null, fill: 'smile', blush: 0.9, arm: [-30, 30], extra: 'love' },
      curious: { lx: 10, brow: 'tilt', line: null, fill: 'tiny', ear: [-12, 4], extra: 'question' },
      surprised: { pupil: 9, wide: true, brow: 'up', line: null, fill: 'o', arm: [40, -40] },
      wink: { eyes: 'wink', line: 'smirk', arm: [15, -140], extra: 'sparkle', blush: 0.4 },
      shy: { eyes: 'happy', ly: 6, line: 'small', blush: 1, arm: [-35, 35], ear: [-10, 10] },
      confused: { lx: -6, ly: 4, brow: 'tilt', line: 'wavy', ear: [-20, 5], arm: [15, -160], extra: 'question' },
      sad: { ly: 8, brow: 'sad', line: 'frown', ear: [-30, 30], arm: [5, -5], extra: 'tear' },
      sleepy: { eyes: 'closed', line: null, fill: 'tiny', ear: [-15, 15], arm: [8, -8], extra: 'zzz' },
    };
    const f = { ...base, ...(looks[emotion] ?? {}) };
    const fill = f.fill ? fills[f.fill] : null;
    const on = (yes) => (yes ? 1 : 0);
    const irisY = 168 + f.ly;

    return {
      emotion,
      w: size,
      h: Math.round(size * 1.1),
      breath: motion ? '0 0; 0 -3; 0 0' : '0 0; 0 0',
      wag: motion ? '0 262 382; 7 262 382; 0 262 382' : '0 262 382; 0 262 382',
      btnGlow: emotion === 'listening' ? 0.9 : 0.45,
      earL: `rotate(${f.ear[0]} 125 115)`,
      earR: `rotate(${f.ear[1]} 275 115)`,
      armL: `rotate(${f.arm[0]} 132 288)`,
      armR: `rotate(${f.arm[1]} 268 288)`,
      openL: on(f.eyes === 'open' || f.eyes === 'wink'),
      openR: on(f.eyes === 'open'),
      happyL: on(f.eyes === 'happy'),
      happyR: on(f.eyes === 'happy' || f.eyes === 'wink'),
      closed: on(f.eyes === 'closed'),
      heart: on(f.eyes === 'heart'),
      rx: f.wide ? 36 : 33,
      ry: f.wide ? 44 : 38,
      pupil: f.pupil,
      irisLx: 152 + f.lx, irisRx: 248 + f.lx, irisY,
      hiLx: 160 + f.lx, hiRx: 256 + f.lx, hiY: irisY - 9,
      hi2Lx: 145 + f.lx, hi2Rx: 241 + f.lx, hi2Y: irisY + 8,
      browL: brows[f.brow][0], browR: brows[f.brow][1],
      mouthLine: f.line ? lines[f.line] : 'M200 226 L 200 226',
      lineOp: on(f.line),
      mouthFill: fill ? fill[0] : 'M200 226 Z',
      fillOp: on(fill),
      tongue: on(fill && fill[1]),
      tongueY: fill && fill[1] ? fill[1] : 240,
      blush: f.blush,
      sparkle: on(f.extra === 'sparkle'),
      love: on(f.extra === 'love'),
      question: on(f.extra === 'question'),
      zzz: on(f.extra === 'zzz'),
      dots: on(f.extra === 'dots'),
      waves: on(f.extra === 'waves'),
      tear: on(f.extra === 'tear'),
    };
  }
}
</script>
</body>
</html>
