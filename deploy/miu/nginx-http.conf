# Temporary certificate bootstrap virtual host: this domain only.
server {
    listen 80;
    listen [::]:80;
    server_name miu.curiopal.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/miu/acme;
        default_type text/plain;
    }
    location / {
        return 302 https://miu.curiopal.com$request_uri;
    }
}
