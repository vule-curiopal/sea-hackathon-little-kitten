server {
    listen 80;
    listen [::]:80;
    server_name miu.curiopal.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/miu/acme;
        default_type text/plain;
    }
    location / { return 301 https://miu.curiopal.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name miu.curiopal.com;
    ssl_certificate /etc/miu/letsencrypt/live/miu.curiopal.com/fullchain.pem;
    ssl_certificate_key /etc/miu/letsencrypt/live/miu.curiopal.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # Generated from Cloudflare's published CIDRs; scope is this vhost only.
    include /etc/nginx/snippets/miu-cloudflare-realip.conf;
    client_max_body_size 6m;
    client_body_timeout 45s;
    access_log /var/log/nginx/miu.access.log;
    error_log /var/log/nginx/miu.error.log;
    error_page 413 = @miu_too_large;
    root /opt/miu/current/frontend/dist;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/miu/acme;
        default_type text/plain;
    }
    location = /deploy-info.json {
        alias /opt/miu/current/deploy-info.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location ~ "^/api/sessions/[a-f0-9-]{36}/speech-stream$" {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 45s;
        proxy_pass http://127.0.0.1:4611;
    }
    location /api/ {
        include /etc/nginx/snippets/miu-proxy.conf;
        proxy_pass http://127.0.0.1:4611;
    }
    location /test-audio/ {
        alias /opt/miu/current/test-assets/voice-pipeline/;
        index preview.html;
        autoindex off;
        add_header Cache-Control "no-store" always;
    }
    location @miu_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"recording_too_large","message":"Bạn thử lại nhé.","retryable":false}}';
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
